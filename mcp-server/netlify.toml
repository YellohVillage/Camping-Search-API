# Déploiement Netlify du serveur MCP (projet Netlify distinct de l'API REST, même dépôt).
# Dans l'interface Netlify du projet MCP : Base directory = mcp-server (Netlify lit alors ce fichier).
# Le netlify.toml de la racine du dépôt concerne uniquement le projet de l'API REST.

[build]
  # Chemins relatifs au répertoire de base (mcp-server/).
  # Vérifie les types et lance les tests avant chaque déploiement : un échec bloque la publication.
  command = "npm run typecheck && npm test"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # netlify/functions/mcp.ts est regroupée par Netlify (esbuild) et servie sur /mcp, /mcp/* et /health.
  directory = "netlify/functions"
  node_bundler = "esbuild"
