# Déploiement Netlify (cible principale) — voir README.md, section « Déploiement Netlify ».
[build]
  # Vérifie les types et lance les tests avant chaque déploiement : un échec bloque la publication.
  command = "npm run typecheck && npm test"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # netlify/functions/api.ts est regroupée par Netlify (esbuild) et servie sur /v1/* (config.path).
  directory = "netlify/functions"
  node_bundler = "esbuild"
