# Déploiement Netlify : un seul projet (camping-search-api) pour l'API REST et le serveur MCP.
#   - API REST (code dans api-rest/)   : fonction netlify/functions/api.mts, servie sur /v1/*
#   - Serveur MCP (code dans mcp-server/) : fonction netlify/functions/mcp.mts, servie sur /mcp, /mcp/* et /health
# Dans l'interface Netlify, laisser « Base directory », « Build command » et « Publish directory » vides :
# ce fichier les définit.

[build]
  # Installe, vérifie les types et teste les deux projets avant chaque déploiement : un échec bloque la publication.
  command = "(cd api-rest && npm ci && npm run typecheck && npm test) && (cd mcp-server && npm ci && npm run typecheck && npm test)"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # Points d'entrée minces ; Netlify les regroupe (esbuild) avec le code et les dépendances de chaque projet.
  directory = "netlify/functions"
  node_bundler = "esbuild"
