# Déploiement Netlify de l'API REST (cible principale).
# Le dépôt contient plusieurs projets : l'API REST est dans api-rest/ (les spécifications dans specs/).
# Ce fichier, à la racine, indique à Netlify de construire depuis api-rest/ : dans l'interface Netlify,
# laisser « Base directory » vide (c'est ce fichier qui le fixe).

[build]
  base = "api-rest"
  # Chemins relatifs au répertoire de base (api-rest/).
  # Vérifie les types et lance les tests avant chaque déploiement : un échec bloque la publication.
  command = "npm run typecheck && npm test"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # api-rest/netlify/functions/api.ts est regroupée par Netlify (esbuild) et servie sur /v1/*.
  directory = "netlify/functions"
  node_bundler = "esbuild"
